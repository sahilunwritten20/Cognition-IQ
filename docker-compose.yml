# Local dev only. MongoDB runs as a single-node replica set (needed for transactions).
services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports: ["27017:27017"]
    healthcheck:
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 10
    volumes: [mongo_data:/data/db]
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  mongo_data:
